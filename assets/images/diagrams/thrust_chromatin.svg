<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" role="img" aria-labelledby="chromatin-title chromatin-desc">
  <title id="chromatin-title">High-Resolution Epigenomic Assays and Single-Cell Profiling</title>
  <desc id="chromatin-desc">Schematic showing (A) single-base-pair ChIP-exo, WhIP-exo, and PB-exo borders versus conventional 200-bp ChIP-seq peaks, (B) Benzonase-seq rotational and translational nucleosome-TF phasing, and (C) AVITI24 multi-modal in situ single-cell profiling.</desc>
  <defs>
    <marker id="chr-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#005BBB"/>
    </marker>
    <marker id="chr-arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0D9488"/>
    </marker>
    <marker id="chr-arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="558" height="318" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="18" y="12" width="5" height="15" rx="2.5" fill="#005BBB"/>
  <text x="30" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.8" font-weight="700" letter-spacing="0.3" fill="#005BBB">THRUST 01 · HIGH-RESOLUTION EPIGENOMIC ASSAYS &amp; REFERENCE ATLASES</text>
  <line x1="18" y1="33" x2="542" y2="33" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ========================================== -->
  <!-- PANEL A: ChIP-seq vs 1-bp ChIP/WhIP-exo    -->
  <!-- ========================================== -->
  <rect x="18" y="40" width="524" height="86" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="28" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="10.3" font-weight="700" fill="#0F172A">A. Single-Base Borders: ChIP-exo v6, WhIP-exo &amp; PB-exo</text>

  <!-- Left: Broad ChIP-seq -->
  <path d="M 36 102 Q 124 58 212 102 Z" fill="#E2E8F0" opacity="0.8"/>
  <path d="M 36 102 Q 124 58 212 102" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="32" y1="102" x2="216" y2="102" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="124" y="96" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#334155">Conventional (~200 bp)</text>
  <text x="124" y="117" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.6" fill="#64748B">Obscured protein–DNA borders</text>

  <!-- Transition Arrow -->
  <line x1="226" y1="92" x2="258" y2="92" stroke="#005BBB" stroke-width="1.8" marker-end="url(#chr-arrow-blue)"/>
  <text x="242" y="83" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.6" font-weight="700" fill="#005BBB">λ exo</text>

  <!-- Right: 1-bp ChIP-exo / WhIP-exo Strand-Specific Borders -->
  <line x1="270" y1="90" x2="432" y2="90" stroke="#005BBB" stroke-width="1.5"/>
  <line x1="270" y1="95" x2="432" y2="95" stroke="#0D9488" stroke-width="1.5"/>

  <!-- 5' (+) spike -->
  <path d="M 314 90 L 318 62 L 322 90 Z" fill="#005BBB"/>
  <text x="310" y="72" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.6" font-weight="700" fill="#005BBB">5'(+)</text>

  <!-- Bound TF / PIC -->
  <rect x="324" y="81" width="52" height="22" rx="11" fill="#EFF6FF" stroke="#005BBB" stroke-width="1.5"/>
  <text x="350" y="95" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#005BBB">TF / PIC</text>

  <!-- 5' (-) spike -->
  <path d="M 378 95 L 382 121 L 386 95 Z" fill="#0D9488"/>
  <text x="390" y="117" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.6" font-weight="700" fill="#0F766E">5'(−)</text>

  <!-- Callout Box -->
  <rect x="438" y="64" width="94" height="52" rx="5" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
  <text x="485" y="79" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" font-weight="700" fill="#0F766E">±1 bp</text>
  <text x="485" y="93" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.4" font-weight="700" fill="#1E293B">ChIP-exo v6</text>
  <text x="485" y="107" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.1" fill="#475569">WhIP-exo · PB-exo</text>

  <!-- ========================================== -->
  <!-- PANEL B: Benzonase-seq Phasing             -->
  <!-- ========================================== -->
  <rect x="18" y="134" width="524" height="84" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="28" y="149" font-family="system-ui, -apple-system, sans-serif" font-size="10.3" font-weight="700" fill="#0F172A">B. Rotational &amp; Translational Nucleosome–TF Phasing (Benzonase-seq)</text>

  <!-- Promoter DNA Axis -->
  <line x1="34" y1="188" x2="380" y2="188" stroke="#94A3B8" stroke-width="2"/>

  <!-- Promoter TF -->
  <rect x="44" y="175" width="54" height="26" rx="13" fill="#005BBB"/>
  <text x="71" y="191" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF">TF</text>

  <!-- Translational Spacing Arrow -->
  <line x1="104" y1="173" x2="152" y2="173" stroke="#475569" stroke-width="1.3" marker-start="url(#chr-arrow-slate)" marker-end="url(#chr-arrow-slate)"/>
  <text x="128" y="166" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.3" font-weight="600" fill="#334155">Translational</text>

  <!-- +1 Nucleosome with 10-bp Rotational Ticks -->
  <ellipse cx="204" cy="187" rx="44" ry="18" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <line x1="172" y1="168" x2="172" y2="174" stroke="#0D9488" stroke-width="1.6"/>
  <line x1="185" y1="166" x2="185" y2="172" stroke="#0D9488" stroke-width="1.6"/>
  <line x1="198" y1="165" x2="198" y2="171" stroke="#0D9488" stroke-width="1.6"/>
  <line x1="211" y1="165" x2="211" y2="171" stroke="#0D9488" stroke-width="1.6"/>
  <line x1="224" y1="166" x2="224" y2="172" stroke="#0D9488" stroke-width="1.6"/>
  <line x1="236" y1="168" x2="236" y2="174" stroke="#0D9488" stroke-width="1.6"/>
  <text x="204" y="191" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#4338CA">+1 Nuc</text>

  <!-- +2 Nucleosome -->
  <ellipse cx="318" cy="187" rx="44" ry="18" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <line x1="286" y1="168" x2="286" y2="174" stroke="#0D9488" stroke-width="1.6"/>
  <line x1="299" y1="166" x2="299" y2="172" stroke="#0D9488" stroke-width="1.6"/>
  <line x1="312" y1="165" x2="312" y2="171" stroke="#0D9488" stroke-width="1.6"/>
  <line x1="325" y1="165" x2="325" y2="171" stroke="#0D9488" stroke-width="1.6"/>
  <line x1="338" y1="166" x2="338" y2="172" stroke="#0D9488" stroke-width="1.6"/>
  <line x1="350" y1="168" x2="350" y2="174" stroke="#0D9488" stroke-width="1.6"/>
  <text x="318" y="191" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#4338CA">+2 Nuc</text>

  <!-- Right Callout: 10 bp Rotational Phasing Wave -->
  <rect x="388" y="159" width="144" height="49" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <path d="M 398 176 Q 408 164 418 176 T 438 176 T 458 176 T 478 176 T 498 176 T 518 176" fill="none" stroke="#0D9488" stroke-width="1.8"/>
  <text x="460" y="193" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.8" font-weight="700" fill="#0F766E">~10 bp Helical Groove</text>
  <text x="460" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.2" fill="#475569">Rotational Phasing</text>

  <!-- ========================================== -->
  <!-- PANEL C: Multi-Modal AVITI24 Profiling     -->
  <!-- ========================================== -->
  <rect x="18" y="226" width="524" height="82" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="28" y="241" font-family="system-ui, -apple-system, sans-serif" font-size="10.3" font-weight="700" fill="#0F172A">C. Multi-Modal In Situ Single-Cell Profiling (AVITI24)</text>

  <!-- Perturbed Single Cells -->
  <circle cx="52" cy="274" r="18" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <circle cx="52" cy="274" r="7.5" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.2"/>
  <text x="80" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#0F172A">Acute-Stress</text>
  <text x="80" y="283" font-family="system-ui, -apple-system, sans-serif" font-size="8.4" fill="#475569">Human Cells</text>

  <line x1="154" y1="274" x2="178" y2="274" stroke="#0D9488" stroke-width="1.8" marker-end="url(#chr-arrow-teal)"/>

  <!-- 3 Simultaneous In Situ Readouts -->
  <rect x="184" y="248" width="190" height="16" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="279" y="259" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#005BBB">In Situ RNA Transcripts</text>

  <rect x="184" y="267" width="190" height="16" rx="4" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
  <text x="279" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#4338CA">Targeted Nuclear &amp; Surface Protein</text>

  <rect x="184" y="286" width="190" height="16" rx="4" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
  <text x="279" y="297" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#0F766E">High-Content Cell Morphology</text>

  <line x1="380" y1="274" x2="404" y2="274" stroke="#005BBB" stroke-width="1.8" marker-end="url(#chr-arrow-blue)"/>

  <!-- Single-Cell State Trajectories -->
  <rect x="410" y="248" width="122" height="53" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="434" cy="265" r="3" fill="#005BBB"/>
  <circle cx="442" cy="261" r="3" fill="#005BBB"/>
  <circle cx="439" cy="271" r="3" fill="#005BBB"/>
  <circle cx="468" cy="264" r="3" fill="#4F46E5"/>
  <circle cx="476" cy="270" r="3" fill="#4F46E5"/>
  <circle cx="502" cy="262" r="3" fill="#0D9488"/>
  <circle cx="508" cy="269" r="3" fill="#0D9488"/>
  <path d="M 442 266 Q 472 268 504 265" fill="none" stroke="#64748B" stroke-width="1.1" stroke-dasharray="2,2"/>
  <text x="471" y="292" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E293B">State Trajectories</text>
</svg>
