<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" role="img" aria-labelledby="struct-title struct-desc">
  <title id="struct-title">Generative Diffusion Distillation and Biomolecular Modeling</title>
  <desc id="struct-desc">Schematic showing (A) MS-sCD and Blitz continuous-time consistency distillation compressing 200-step AlphaFold3 and Boltz-2 diffusion down to 8 to 16 steps for a 12 to 25x speedup with preserved complex accuracy, and (B) OmniFold and ProteinDesign-Containers decoupled CPU/GPU infrastructure across x86_64 and ARM64 clusters.</desc>
  <defs>
    <marker id="st-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#005BBB"/>
    </marker>
    <marker id="st-arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#4F46E5"/>
    </marker>
    <marker id="st-arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="558" height="318" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="18" y="12" width="5" height="15" rx="2.5" fill="#0D9488"/>
  <text x="30" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.8" font-weight="700" letter-spacing="0.3" fill="#0F766E">THRUST 03 · GENERATIVE DIFFUSION DISTILLATION &amp; BIOMOLECULAR MODELING</text>
  <line x1="18" y1="33" x2="542" y2="33" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ========================================== -->
  <!-- PANEL A: MS-sCD & Blitz Distillation       -->
  <!-- ========================================== -->
  <rect x="18" y="40" width="524" height="148" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="28" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="10.3" font-weight="700" fill="#0F172A">A. Continuous-Time Consistency Distillation (MS-sCD &amp; Blitz)</text>

  <!-- Left Box: Gaussian Noise Prior -->
  <rect x="28" y="68" width="80" height="108" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="68" y="83" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.6" font-weight="700" fill="#334155">Noise Prior</text>
  <circle cx="46" cy="100" r="2.8" fill="#94A3B8"/>
  <circle cx="62" cy="97" r="2.8" fill="#64748B"/>
  <circle cx="83" cy="103" r="2.8" fill="#94A3B8"/>
  <circle cx="53" cy="115" r="2.8" fill="#64748B"/>
  <circle cx="74" cy="117" r="2.8" fill="#94A3B8"/>
  <circle cx="43" cy="130" r="2.8" fill="#94A3B8"/>
  <circle cx="66" cy="133" r="2.8" fill="#64748B"/>
  <circle cx="88" cy="127" r="2.8" fill="#94A3B8"/>
  <circle cx="56" cy="145" r="2.8" fill="#94A3B8"/>
  <circle cx="80" cy="144" r="2.8" fill="#64748B"/>
  <text x="68" y="166" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.2" font-weight="600" fill="#64748B">x_T (t = 1)</text>

  <!-- Teacher Trajectory (~200 steps) -->
  <rect x="142" y="66" width="204" height="19" rx="9.5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="244" y="79" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.4" font-weight="600" fill="#475569">Teacher ODE: ~200 Diffusion Steps</text>

  <path d="M 114 108 Q 244 86 374 108" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="3,3" marker-end="url(#st-arrow-slate)"/>
  <circle cx="142" cy="104" r="2" fill="#64748B"/>
  <circle cx="170" cy="100" r="2" fill="#64748B"/>
  <circle cx="198" cy="98" r="2" fill="#64748B"/>
  <circle cx="226" cy="97" r="2" fill="#64748B"/>
  <circle cx="254" cy="97" r="2" fill="#64748B"/>
  <circle cx="282" cy="98" r="2" fill="#64748B"/>
  <circle cx="310" cy="100" r="2" fill="#64748B"/>
  <circle cx="338" cy="104" r="2" fill="#64748B"/>

  <!-- Consistency Distillation Vertical Arrows -->
  <line x1="184" y1="103" x2="184" y2="132" stroke="#4F46E5" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#st-arrow-indigo)"/>
  <line x1="304" y1="103" x2="304" y2="132" stroke="#4F46E5" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#st-arrow-indigo)"/>
  <rect x="200" y="109" width="88" height="17" rx="8.5" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1"/>
  <text x="244" y="121" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.3" font-weight="700" fill="#4338CA">MS-sCD</text>

  <!-- Student Trajectory (Blitz: 8-16 steps) -->
  <path d="M 114 138 Q 244 152 374 138" fill="none" stroke="#005BBB" stroke-width="2.6" marker-end="url(#st-arrow-blue)"/>
  <circle cx="179" cy="143" r="4.2" fill="#0D9488" stroke="#FFFFFF" stroke-width="1.4"/>
  <circle cx="244" cy="145" r="4.2" fill="#0D9488" stroke="#FFFFFF" stroke-width="1.4"/>
  <circle cx="309" cy="143" r="4.2" fill="#0D9488" stroke="#FFFFFF" stroke-width="1.4"/>

  <rect x="142" y="156" width="204" height="21" rx="10.5" fill="#EFF6FF" stroke="#005BBB" stroke-width="1.2"/>
  <text x="244" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.6" font-weight="700" fill="#005BBB">Blitz Student: 8–16 Jumps</text>

  <!-- Right Box: Quantitative Speedup & Fidelity Takeaway -->
  <rect x="384" y="68" width="148" height="108" rx="6" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.4"/>
  <text x="458" y="83" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.8" font-weight="700" fill="#0F766E">AF3 &amp; Boltz-2 Speedup</text>

  <text x="394" y="101" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.8" font-weight="600" fill="#64748B">~200</text>
  <rect x="424" y="94" width="98" height="8" rx="4" fill="#CBD5E1"/>

  <text x="394" y="118" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.8" font-weight="700" fill="#005BBB">8–16</text>
  <rect x="424" y="111" width="14" height="8" rx="4" fill="#005BBB"/>

  <rect x="394" y="128" width="128" height="22" rx="4" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.1"/>
  <text x="458" y="143" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.2" font-weight="700" fill="#0F766E">~12–25× Faster</text>

  <text x="458" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#1E293B">Preserved Complex Accuracy</text>

  <!-- ========================================== -->
  <!-- PANEL B: Decoupled CPU/GPU Infrastructure  -->
  <!-- ========================================== -->
  <rect x="18" y="196" width="524" height="112" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="28" y="213" font-family="system-ui, -apple-system, sans-serif" font-size="10.3" font-weight="700" fill="#0F172A">B. Decoupled CPU/GPU Container Infrastructure</text>

  <!-- Card 1: Supported Models -->
  <rect x="28" y="224" width="176" height="74" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="36" y="232" width="76" height="24" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
  <text x="74" y="247" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#005BBB">AlphaFold3</text>

  <rect x="120" y="232" width="76" height="24" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
  <text x="158" y="247" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#005BBB">Boltz-2</text>

  <rect x="36" y="264" width="76" height="24" rx="4" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
  <text x="74" y="279" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#4338CA">Chai-1</text>

  <rect x="120" y="264" width="76" height="24" rx="4" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
  <text x="158" y="279" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.3" font-weight="700" fill="#0F766E">RFdiffusion</text>

  <!-- Card 2: OmniFold & ProteinDesign-Containers -->
  <rect x="216" y="224" width="156" height="74" rx="6" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="294" y="241" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.4" font-weight="700" fill="#4338CA">OmniFold</text>
  <text x="294" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.4" font-weight="600" fill="#1E293B">Decoupled CPU MSA Search</text>
  <text x="294" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.4" fill="#334155">&amp; Async GPU Inference</text>
  <text x="294" y="287" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.8" font-weight="600" fill="#4338CA">ProteinDesign-Containers</text>

  <!-- Card 3: Portable Cluster Execution -->
  <rect x="384" y="224" width="148" height="74" rx="6" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.2"/>
  <text x="458" y="241" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#0F766E">Portable HTC Clusters</text>
  <text x="458" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.4" font-weight="600" fill="#1E293B">x86_64 &amp; ARM64 GH200</text>
  <text x="458" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.4" fill="#334155">Slurm &amp; HTCondor</text>
  <text x="458" y="287" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#0F766E">Rootless Apptainer</text>
</svg>
