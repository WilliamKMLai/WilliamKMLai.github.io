- id: chromatin
  number: "01"
  short_title: "Assays & Reference Atlases"
  title: "High-Resolution Epigenomic Assays & Reference Atlases"
  subtitle: "Mapping transcription factor footprints, nucleosome phasing, pre-initiation complex assembly, and single-cell stress states from nucleotide to genome-wide scale"
  paragraphs:
    - "Conventional chromatin immunoprecipitation obscures multi-protein regulatory architecture behind ~200-bp sonication fragments. We develop and apply single-base-pair exonuclease and endonuclease assays including ChIP-exo (v6), WhIP-exo, Benzonase-seq, PB-exo, and MNase-ChIP-seq to resolve strand-specific protein–DNA borders, map ~10-bp rotational and translational nucleosome phasing relative to human transcription factors, and dissect pre-initiation complex (PIC) assembly at natural promoters alongside multi-modal in situ single-cell stress profiling on AVITI24."
    - "By engineering streamlined, cost-effective wet-bench protocols, we deploy high-resolution footprinting at scale to build foundational community reference atlases, including the near-complete >400-protein Saccharomyces cerevisiae promoter architecture atlas (Yeast Epigenome Project) and the NIH Common Fund ChIP-exo validation screen of 887 human transcription factor monoclonal antibodies."
  assays_or_methods:
    - "ChIP-exo v6"
    - "WhIP-exo"
    - "Benzonase-seq"
    - "PB-exo"
    - "PIP-seq"
    - "MNase-ChIP-seq"
    - "AVITI24"
  related_tools: []
  diagram:
    src: "/assets/images/diagrams/thrust_chromatin.svg"
    width: 560
    height: 320
    alt: "Schematic showing (A) single-base-pair ChIP-exo, WhIP-exo, and PB-exo borders versus conventional 200-bp ChIP-seq peaks, (B) Benzonase-seq rotational and translational nucleosome-TF phasing, and (C) AVITI24 multi-modal in situ single-cell profiling"
    caption: "Experimental resolution spanning ±1-bp exonuclease borders (ChIP-exo v6, WhIP-exo, PB-exo), helical rotational and translational nucleosome–TF phasing (Benzonase-seq), and multi-modal in situ single-cell profiling of RNA, protein, and morphology (AVITI24)."
  highlight_pub_ids:
    - "chen-2026-pic-molcell"
    - "lang-2026-aviti24"
    - "chen-2026-molcell"
    - "mittal-2022-gad"
    - "lai-2021-pcrp"
    - "rossi-2021-yep"

- id: bioinformatics
  number: "02"
  short_title: "Bioinformatic Algorithms"
  title: "Bioinformatic Algorithm Development"
  subtitle: "Statistical, alignment, provenance, motif-consolidation, causal network, and interpretable machine learning methods for high-resolution regulatory genomics"
  paragraphs:
    - "Resolving biological mechanism from nucleotide-resolution footprinting and large-scale epigenomic datasets requires specialized statistical and signal-processing methods. Our algorithmic work addresses core analytical problems across regulatory genomics: coordinate-free chromatin profile alignment and locus signal extraction (ArchAlign, ArchTEx), probabilistic mixture modeling of direct versus indirect ChIP-exo binding subtypes (ChExMix), clustered consolidation of redundant sequence motifs into canonical archetypes (GenoCLAMP), and sequencing-read genotype verification to safeguard strain and cell-line provenance (GenoPipe)."
    - "To move beyond correlative co-occupancy and black-box sequence models, we also develop causal network and post-hoc explainability frameworks. SETIA integrates physical factor binding, perturbation transcriptomics, and nascent RNA kinetics to infer directed gene regulatory networks, while Adversarial Particle Swarm Optimization (APSO) and ChromEnhancer probe sequence-free neural chromatin classifiers to identify positive and negative predictive chromatin features without holdout data."
  assays_or_methods:
    - "Coordinate-Free Alignment"
    - "ChIP-exo Subtype Modeling"
    - "Motif Consolidation"
    - "Genotype-of-Origin QC"
    - "Causal GRN Inference"
    - "Sequence-Free Chromatin XAI"
  related_tools:
    - name: "GenoCLAMP"
      id: "genoclamp"
    - name: "SETIA"
      id: "setia"
    - name: "ChromEnhancer"
      id: "chromenhancer"
    - name: "APSO"
      id: "apso"
    - name: "GenoPipe"
      id: "genopipe"
    - name: "ChExMix"
      id: "chexmix"
    - name: "ArchAlign"
