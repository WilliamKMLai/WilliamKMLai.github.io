  diagram:
    src: "/assets/images/diagrams/thrust_xai_grn.svg"
    width: 560
    height: 320
    alt: "Four-panel overview of bioinformatic algorithms: (A) Chromatin Alignment and Subtypes (ArchAlign, ArchTEx, ChExMix, GenoCLAMP), (B) Dataset Genotype Verification (GenoPipe), (C) Causal Regulatory Network Inference (SETIA), and (D) Explainable Chromatin Modeling (APSO, ChromEnhancer)"
    caption: "Core algorithmic capabilities across chromatin alignment, binding-subtype deconvolution, and motif consolidation (ArchAlign, ArchTEx, ChExMix, GenoCLAMP), sequencing genotype verification (GenoPipe), causal GRN inference (SETIA), and sequence-free chromatin interpretability (APSO, ChromEnhancer)."
