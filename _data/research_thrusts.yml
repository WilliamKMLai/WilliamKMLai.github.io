- id: structural-ai
  number: "03"
  short_title: "Biomolecular Diffusion AI"
  title: "Generative Diffusion Distillation & Biomolecular Modeling"
  subtitle: "Compressing all-atom biomolecular diffusion trajectories to 8–16 steps and scaling containerized structure prediction across heterogeneous supercomputers"
  paragraphs:
    - "All-atom diffusion models such as AlphaFold3 and Boltz-2 achieve high accuracy on protein–nucleic acid and ligand complexes, but their ~200-step iterative denoising trajectories bottleneck proteome-scale complex screening. We formulate Multistep Stable Continuous-Time Consistency Distillation (MS-sCD) and apply it in Blitz to distill AlphaFold3 and Boltz-2 diffusion modules down to 8–16 inference steps—yielding a ~12–25× diffusion speedup while preserving atomic interface fidelity."
    - "To execute generative complex prediction and de novo binder design across high-throughput computing (HTC) clusters, we engineer OmniFold and ProteinDesign-Containers. Rootless Apptainer/Singularity images unify AlphaFold3, Boltz-2, Chai-1, and RFdiffusion across x86_64 and ARM64 (NVIDIA Grace Hopper GH200) nodes while decoupling CPU-bound MSA and template search from asynchronous GPU diffusion inference."
  assays_or_methods:
    - "Consistency Distillation"
    - "AlphaFold3 & Boltz-2 Acceleration"
    - "Chai-1 & RFdiffusion"
    - "Decoupled CPU/GPU HTC"
    - "x86_64 & ARM64 GH200 Containers"
  related_tools:
    - name: "Blitz"
      id: "blitz"
    - name: "MS-sCD"
      id: "ms-scd"
    - name: "OmniFold"
      id: "omnifold"
    - name: "ProteinDesign-Containers"
      id: "proteindesign-containers"
  diagram:
    src: "/assets/images/diagrams/thrust_structural_ai.svg"
    width: 560
    height: 320
    alt: "Schematic showing (A) MS-sCD and Blitz continuous-time consistency distillation compressing 200-step AlphaFold3 and Boltz-2 diffusion down to 8 to 16 steps for a 12 to 25x speedup with preserved complex accuracy, and (B) OmniFold and ProteinDesign-Containers decoupled CPU/GPU infrastructure"
    caption: "MS-sCD and Blitz compress ~200-step biomolecular diffusion trajectories to 8–16 consistency jumps (~12–25× faster with preserved complex accuracy), paired with OmniFold and ProteinDesign-Containers for decoupled CPU/GPU execution across x86_64 and ARM64 clusters."
  highlight_pub_ids:
    - "mathew-2026-blitz"
    - "mathew-2026-ms-scd"
    - "mathew-2025-omnifold"

- id: fair-gateways
  number: "04"
  short_title: "Open-Science Gateways"
  title: "Open-Science Gateways, Accessibility & HPC Education"
  subtitle: "Lowering computational barriers through FAIR open-science platforms, interactive web portals, Open OnDemand apps, and living-lab cloud classrooms"
  paragraphs:
    - "Computational genomics and structural modeling achieve broader scientific reach when experimentalists and trainees can execute reproducible analyses without command-line or cluster-administration barriers. Anchored by FAIR open-science principles, we develop interoperable platforms spanning laboratory and sequencing metadata provenance (PEGR), dual graphical and batch command-line base-pair genomics analysis (ScriptManager), and templated interactive web portals for community dataset exploration (STENCIL)."
    - "In parallel, we build browser-accessible high-performance computing and educational cloud gateways that democratize GPU and cluster resources. ProteinStructure-OOD provides code-free AlphaFold2/3 job submission on Slurm clusters via Open OnDemand, while EGC-jupyterhub pairs federated JupyterHub instances with CILogon single sign-on to support zero-cost computational biology instruction across university courses and K–12 living labs."
  assays_or_methods:
    - "FAIR Open-Science Platforms"
    - "Dual GUI & CLI Analysis"
    - "Provenance LIMS (PEGR)"
    - "Interactive Web Portals"
    - "Open OnDemand Slurm Apps"
    - "University & K–12 Cloud Classrooms"
  related_tools:
    - name: "ScriptManager"
      id: "scriptmanager"
    - name: "PEGR"
      id: "pegr"
    - name: "STENCIL"
      id: "stencil"
    - name: "ProteinStructure-OOD"
      id: "proteinstructure-ood"
    - name: "EGC-jupyterhub"
