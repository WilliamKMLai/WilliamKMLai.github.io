    - Multi-Omics
  featured: false

- id: chexmix
  name: ChExMix
  category: epigenomics
  category_label: "Epigenomics & GRNs"
  tagline: "Probabilistic mixture modeling of protein-DNA binding subtypes in ChIP-exo"
  description: "Deconvolves distinct sequence-specific direct DNA binding events from indirect tether/cofactor interactions within high-resolution ChIP-exo footprints using strand-specific exonuclease tag distributions and motif discovery."
  org: EpiGenomicsCode
  repo_url: "https://github.com/EpiGenomicsCode/EGC-chexmix"
  alt_org: seqcode
  alt_repo_url: "https://github.com/seqcode/chexmix"
  paper_url: "https://doi.org/10.1093/bioinformatics/bty703"
  paper_label: "Yamada et al., Bioinformatics 2019"
  tech_stack:
    - Java
    - Mixture Modeling
    - ChIP-exo Subtypes
  featured: false

- id: archalign
  name: ArchAlign
  category: epigenomics
  category_label: "Epigenomics & GRNs"
  tagline: "Coordinate-free alignment of high-resolution chromatin profiles"
  description: "Discovers shared nucleosome and chromatin remodeling architectures across unaligned genomic loci without requiring an a priori sequence landmark such as a transcription start site or motif."
