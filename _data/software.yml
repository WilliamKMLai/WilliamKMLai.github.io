- id: blitz
  name: Blitz
  category: ai-structure
  category_label: "XAI & Structural AI"
  tagline: "Few-step consistency distillation accelerating AlphaFold3 & Boltz-2 diffusion"
  description: "Compresses the ~200-step generative diffusion modules of AlphaFold3 and Boltz-2 down to 8–16 inference steps via continuous-time consistency distillation, preserving atomic biomolecular complex accuracy at a fraction of GPU cost."
  org: EpiGenomicsCode
  repo_url: "https://github.com/EpiGenomicsCode/Blitz"
  paper_url: "https://arxiv.org/abs/2610.23703"
  paper_label: "Mathew et al., arXiv 2026"
  tech_stack:
    - PyTorch
    - Diffusion Distillation
    - AlphaFold3 / Boltz-2
  featured: true

