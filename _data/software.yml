# Complete catalog of open-source software, containers, and science gateways
# Categories: epigenomics | ai-structure | gateways

- id: scriptmanager
  name: ScriptManager
  category: epigenomics
  category_label: "Epigenomics & GRNs"
  tagline: "Interactive GUI & CLI platform for reproducible base-pair genomics analysis"
  description: "Java-based graphical and command-line analysis suite providing standardized BAM/BED/FASTA manipulation, base-pair ChIP-exo and Benzonase-seq read pileups, nucleosome phasing metrics, and publication-ready heatmaps without requiring command-line expertise."
  org: CEGRcode
  repo_url: "https://github.com/CEGRcode/scriptmanager"
  docs_url: "https://pughlab.mbg.cornell.edu/scriptmanager-docs"
  paper_url: "https://doi.org/10.64898/2026.06.14.732163"
  paper_label: "Lang et al., BMC Bioinformatics 2026 (In Press)"
  tech_stack:
    - Java
    - CLI / Swing GUI
    - ChIP-exo
    - FAIR Workflows
  featured: true

- id: genoclamp
  name: GenoCLAMP
  category: epigenomics
  category_label: "Epigenomics & GRNs"
  tagline: "Genomic Clustered Alignment of Motif Profiles at atlas scale"
  description: "Consolidates redundant position weight matrices and de novo sequence motifs discovered across hundreds of ChIP-exo and functional genomics datasets into non-redundant, biologically interpretable transcription factor motif families."
  org: CEGRcode
  repo_url: "https://github.com/CEGRcode/GenoCLAMP"
  paper_url: "https://doi.org/10.1186/s13059-026-04283-9"
  paper_label: "Cha et al., Genome Biology 2026"
  tech_stack:
    - Python
    - Motif Consolidation
    - ChIP-exo Atlases
  featured: true

- id: genopipe
  name: GenoPipe
  category: epigenomics
  category_label: "Epigenomics & GRNs"
  tagline: "Automated genotype-of-origin verification for (epi)genomic datasets"
  description: "Detects sample swaps, cross-contamination, strain backgrounds, and epitope-tag/knockout genotypes directly from raw FASTQ/BAM ChIP-seq, ChIP-exo, ATAC-seq, and RNA-seq reads to safeguard experimental rigor."
  org: EpiGenomicsCode
  repo_url: "https://github.com/EpiGenomicsCode/GenoPipe"
  docs_url: "https://pughlab.mbg.cornell.edu/GenoPipe-docs"
  paper_url: "https://doi.org/10.1093/nar/gkad950"
  paper_label: "Lang et al., NAR 2023"
  tech_stack:
    - Python
    - Perl / Bash
    - Provenance QC
    - NGS Rigor
  featured: true

- id: setia
  name: SETIA
  category: epigenomics
  category_label: "Epigenomics & GRNs"
  tagline: "Unified causal gene regulatory network inference from orthogonal evidence"
  description: "Integrates direct physical transcription factor occupancy, chromatin architecture, and perturbation transcriptomics to infer directed, causal gene regulatory networks grounded in orthogonal molecular measurements."
